<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='30' width='80' height='60' rx='8' fill='none' stroke='%234A90D9' stroke-width='6'/><rect x='10' y='30' width='80' height='20' rx='8' fill='%234A90D9'/><line x1='10' y1='50' x2='90' y2='50' stroke='%234A90D9' stroke-width='6'/><rect x='25' y='58' width='12' height='12' rx='2' fill='%234A90D9'/><rect x='44' y='58' width='12' height='12' rx='2' fill='%234A90D9'/><rect x='63' y='58' width='12' height='12' rx='2' fill='%234A90D9'/><rect x='25' y='76' width='12' height='12' rx='2' fill='%234A90D9'/><rect x='44' y='76' width='12' height='12' rx='2' fill='%234A90D9'/><rect x='63' y='76' width='12' height='12' rx='2' fill='%234A90D9'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Schedule Maker</title>
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--bg, #F7F6F2);
        color: var(--text, #1F1E1C);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.3s ease;
      }
      #loading-screen.leaving {
        opacity: 0;
        pointer-events: none;
      }
      .loading-icon {
        color: var(--accent, #3B6EA5);
      }
      .loading-title {
        font-family: var(--font-display, Georgia, serif);
        font-weight: 600;
        font-size: 1.375rem;
      }
      .loading-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid var(--line, #D4D0C8);
        border-top-color: var(--accent, #3B6EA5);
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }
      [data-theme$="-dark"] #loading-screen {
        background: var(--bg, #1A1A18);
        color: var(--text, #E8E6DF);
      }
      [data-theme$="-dark"] .loading-icon {
        color: var(--accent, #5B8FC9);
      }
      [data-theme$="-dark"] .loading-spinner {
        border-color: var(--line, #353430);
        border-top-color: var(--accent, #5B8FC9);
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        var family = localStorage.getItem("theme-family") || "default";
        var dark = localStorage.getItem("theme-mode") === "dark";
        document.documentElement.dataset.theme = family + (dark ? "-dark" : "-light");
        window.__LOAD_START__ = performance.now();
      })();
    </script>
  </head>
  <body>
    <div id="loading-screen" role="status" aria-label="Loading">
      <svg class="loading-icon" width="48" height="48" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="10" y="30" width="80" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="6"/>
        <rect x="10" y="30" width="80" height="20" rx="8" fill="currentColor"/>
        <line x1="10" y1="50" x2="90" y2="50" stroke="currentColor" stroke-width="6"/>
        <rect x="25" y="58" width="12" height="12" rx="2" fill="currentColor"/>
        <rect x="44" y="58" width="12" height="12" rx="2" fill="currentColor"/>
        <rect x="63" y="58" width="12" height="12" rx="2" fill="currentColor"/>
        <rect x="25" y="76" width="12" height="12" rx="2" fill="currentColor"/>
        <rect x="44" y="76" width="12" height="12" rx="2" fill="currentColor"/>
        <rect x="63" y="76" width="12" height="12" rx="2" fill="currentColor"/>
      </svg>
      <div class="loading-title">Weekly Schedule Maker</div>
      <div class="loading-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
